<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InWeeks - Track Your Life</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.11/dist/dotlottie-wc.js" type="module"></script>
  <script>
    window.tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          gridTemplateColumns: {
            '13': 'repeat(13, minmax(0, 1fr))',
          },
          colors: {
            primary: "#22c55e",
            "bg-light": "#f8f9fa",
            "card-light": "#ffffff",
            "card-dark": "#1f2937",
            "text-main": "#111827",
            "text-muted": "#6b7280"
          },
          fontFamily: {
            display: ["Manrope", "Inter", "sans-serif"],
            sans: ["Inter", "sans-serif"]
          },
          animation: {
            'float-up': 'floatUp 4s ease-out infinite',
            'slow-glow': 'slowGlow 4s ease-in-out infinite',
            'progress': 'progress 6.5s linear forwards',
            'awakening': 'awakening 2s ease-in-out forwards',
            'bounce-slow': 'bounceSlow 3s ease-in-out infinite'
          },
          keyframes: {
            floatUp: {
              '0%': { transform: 'translateY(100vh) scale(0)', opacity: '0' },
              '20%': { opacity: '0.8' },
              '100%': { transform: 'translateY(-20vh) scale(1)', opacity: '0' }
            },
            slowGlow: {
              '0%, 100%': { backgroundColor: 'rgba(251, 191, 36, 0)' },
              '50%': { backgroundColor: 'rgba(251, 191, 36, 0.08)' }
            },
            progress: {
              '0%': { width: '0%' },
              '100%': { width: '100%' }
            },
            awakening: {
              '0%': { filter: 'brightness(1)', transform: 'scale(1)' },
              '30%': { filter: 'brightness(3) drop-shadow(0 0 15px #22c55e)', transform: 'scale(1.8)' },
              '100%': { filter: 'brightness(1)', transform: 'scale(1)' }
            },
            bounceSlow: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' }
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-display {
      font-family: 'Manrope', sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.91.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="bg-bg-light dark:bg-gray-900 text-text-main dark:text-gray-100 antialiased transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
